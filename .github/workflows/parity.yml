name: PHP MySQL parity
on:
  push:
    branches: [feature/full-gas-parity, develop, main]
  pull_request:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')" bash tests/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-evidence
          path: tests/artifacts/
